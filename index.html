<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Space Rescue</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/space.css">
  <link rel="stylesheet" href="css/panel.css">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/intro.css">
  <link rel="stylesheet" href="css/lesson.css">
  <link rel="stylesheet" href="css/splash.css">
</head>
<body class="pre-start">
  <canvas id="space-bg"></canvas>

  <!-- Starting screen: full-bleed cartoon backdrop, station + title + start -->
  <div id="start-screen">
    <img id="start-station" src="assets/spaceStation.png" alt="Space station orbiting above Earth">
    <div class="start-content">
      <h1 class="start-title">
        <span class="title-space">SPACE</span>
        <span class="title-rescue">RESCUE</span>
      </h1>
      <button type="button" id="start-btn" aria-label="Start game"></button>
    </div>
  </div>

  <!-- ============ Narrated intro: three story cards after START ============ -->
  <div id="intro" class="hide" hidden>
    <button type="button" id="intro-skip">SKIP ▸</button>

    <!-- Hook 1 — context: meteors streak toward the station -->
    <section class="slide">
      <div class="scene">
        <img class="intro-station" src="assets/spaceStation.png" alt="Space station orbiting Earth">
        <img class="intro-meteor m1" src="assets/comet.svg" alt="">
        <img class="intro-meteor m2" src="assets/comet.svg" alt="">
        <img class="intro-meteor m3" src="assets/comet.svg" alt="">
      </div>
      <div class="scene-dim" aria-hidden="true"></div>
      <div class="narrator">
        <span class="who">NARRATOR:</span>
        <p class="line"></p>
      </div>
    </section>

    <!-- Hook 2 — the problem: our cannon, aim unsolved -->
    <section class="slide">
      <div class="scene">
        <div class="intro-cannon">
          <img class="intro-barrel" src="assets/Canon1.svg" alt="">
          <img class="intro-base dome-tint" src="assets/Camnono.png" alt="Defence cannon">
        </div>
        <svg class="warn" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M32 6 60 56 H4 Z" fill="none" stroke="#ff4b3e" stroke-width="5" stroke-linejoin="round"/>
          <line x1="32" y1="24" x2="32" y2="40" stroke="#ff4b3e" stroke-width="5" stroke-linecap="round"/>
          <circle cx="32" cy="48" r="3.2" fill="#ff4b3e"/>
        </svg>
      </div>
      <div class="scene-dim" aria-hidden="true"></div>
      <div class="narrator">
        <span class="who">NARRATOR:</span>
        <p class="line"></p>
      </div>
    </section>

    <!-- Hook 3 — introduce angles: live protractor sweep on the cannon -->
    <section class="slide">
      <div class="scene">
        <svg id="angle-demo" viewBox="0 0 640 400" aria-hidden="true">
          <line class="demo-base" x1="150" y1="330" x2="610" y2="330"/>
          <line class="demo-ray" x1="150" y1="330" x2="490" y2="330"/>
          <path class="demo-arc" d="" fill="none"/>
          <!-- Camnono.png's dome is wider relative to its height than the old
               Canon2.svg art — height kept the same (matches the barrel's
               calibrated foot position) and width recomputed to its true
               aspect, recentred under the barrel's x=150 pivot -->
          <image class="dome-tint" href="assets/Camnono.png" x="46.4" y="194.8" width="207.1" height="143.8"/>
          <image class="demo-barrel" href="assets/Canon1.svg" x="125.3" y="197.25" width="49.4" height="147.5"/>
        </svg>
      </div>
      <div class="scene-dim" aria-hidden="true"></div>
      <div class="narrator">
        <span class="who">NARRATOR:</span>
        <p class="line"></p>
      </div>
    </section>

    <!-- icon nav: appears bottom-right once the sequence completes -->
    <button type="button" id="lets-learn" class="nav-next" hidden aria-label="Continue to the lesson"></button>
  </div>

  <!-- ============ Angle defence game ============ -->
  <div id="game">
    <!-- top banner: just the shared instruction panel (no corner counter) -->
    <div id="hud">
      <p id="prompt" class="info-panel">Read the protractor — which angle is the meteor coming in on?</p>
    </div>

    <!-- play area: protractor rays, meteor, cannon -->
    <div id="arena">
      <svg id="angle-svg" aria-hidden="true"></svg>
      <img id="meteor" src="assets/comet.svg" alt="Incoming meteor">
      <canvas id="fx-canvas" aria-hidden="true"></canvas>
      <div id="cannon">
        <img id="cannon-barrel" src="assets/Canon1.svg" alt="">
        <img id="cannon-base" class="dome-tint" src="assets/Camnono.png" alt="Cannon">
      </div>
      <!-- shield lamps: ground level, clear of every meteor approach path -->
      <span id="lives" aria-label="Shields remaining"></span>
    </div>

    <!-- answer pad -->
    <div id="options" role="group" aria-label="Angle choices"></div>

    <!-- tutorial spotlight: dims everything except the element in focus -->
    <div id="tutorial-dim" aria-hidden="true"></div>

    <!-- full-screen red wash when the cannon takes a hit -->
    <div id="damage-flash" aria-hidden="true"></div>

    <!-- end-of-run scoreboard — same splash design as the start screen -->
    <div id="result" class="splash hide">
      <div class="splash-hills" aria-hidden="true"></div>
      <img class="splash-comet" src="assets/comet.svg" alt="" aria-hidden="true">
      <i class="splash-star s1"></i><i class="splash-star s2"></i><i class="splash-star s3"></i>
      <i class="splash-star s4"></i><i class="splash-star s5"></i>
      <h2 id="result-title" class="splash-title">MISSION COMPLETE</h2>
      <p id="result-text" class="splash-sub"></p>
      <div class="splash-stats">
        <div class="splash-stat"><b id="stat-hits">0</b><span>METEORS DOWN</span></div>
        <div class="splash-stat"><b id="stat-shields">0</b><span>SHIELDS LEFT</span></div>
      </div>
      <svg class="splash-cannon" viewBox="20 190 260 145" aria-hidden="true">
        <path class="fc-arc" d="M 30 330 A 120 120 0 0 1 270 330" fill="none"/>
        <g class="fc-ticks">
          <line x1="262" y1="330" x2="274" y2="330"/>
          <line x1="247" y1="274" x2="257.4" y2="268"/>
          <line x1="206" y1="233" x2="212" y2="222.6"/>
          <line x1="150" y1="218" x2="150" y2="206"/>
          <line x1="94" y1="233" x2="88" y2="222.6"/>
          <line x1="53" y1="274" x2="42.6" y2="268"/>
          <line x1="38" y1="330" x2="26" y2="330"/>
        </g>
        <path class="fc-disc" d="M 70 330 A 80 80 0 0 1 230 330 Z"/>
        <path class="fc-ring" d="M 95 330 A 55 55 0 0 1 205 330" fill="none"/>
        <image class="dome-tint" href="assets/Camnono.png" x="46.4" y="194.8" width="207.1" height="143.8"/>
        <image href="assets/Canon1.svg" x="125.3" y="197.25" width="49.4" height="147.5"/>
      </svg>
      <button type="button" id="again-btn" class="splash-btn">PLAY AGAIN ▸</button>
      <p class="splash-tap">✦&nbsp; Tap to fly again &nbsp;✦</p>
    </div>
  </div>

  <script src="export/space-background.js"></script>
  <script src="js/space-init.js"></script>
  <script src="js/vo.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/fire-fx.js"></script>
  <script src="js/game.js"></script>
  <script src="js/intro.js"></script>
  <script src="js/lesson.js"></script>
  <script src="js/start-screen.js"></script>
</body>
</html>
